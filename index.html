<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xêro | Ateliê de perfumaria</title>
<meta name="description" content="Sinta o Xêro e deleite-se.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--brown:#8a5a3c;--rose:#c9a590;--cream:#e2ded0;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000}
  body{font-family:'Montserrat',system-ui,sans-serif;color:#fff;min-height:100vh;display:flex;justify-content:center}
  .card{width:100%;max-width:480px;position:relative;overflow:hidden;background:#000;padding-bottom:40px}
  .top{background:#fff;padding:16% 0 39.3%;clip-path:polygon(0 0,100% 0,100% 56%,0 100%)}
  .top img{display:block;width:58.5%;height:auto;margin:0 auto}
  .hero{display:flex;align-items:center;gap:6%;padding:0 5%;margin-top:-27%;position:relative}
  .foto{flex:0 0 37%;aspect-ratio:1;border-radius:50%;border:5px solid var(--brown);overflow:hidden;background:#222}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .txt{flex:1;padding-top:14%}
  .txt h2{font-size:clamp(15px,4.6vw,21px);color:var(--rose);font-weight:600;margin-bottom:12px}
  .txt p{font-size:clamp(15px,4.6vw,21px);font-weight:700;line-height:1.25}
  .txt hr{border:0;height:3px;width:42%;background:var(--brown);margin-top:18px}
  .links{display:grid;grid-template-columns:repeat(3,1fr);margin:12% 5% 0;row-gap:28px}
  .links a{display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 4px;color:#fff;text-decoration:none;
    border-left:2px solid #5a3b27;font-size:clamp(10px,3vw,14px);letter-spacing:.14em;font-weight:700;text-transform:uppercase;transition:transform .15s,background .15s}
  .links a:last-child{grid-column:2;border-right:2px solid #5a3b27}
  .links a:nth-child(3){border-right:2px solid #5a3b27}
  .links a:active,.links a:hover{background:#140d08;transform:translateY(-2px)}
  .links svg{width:clamp(48px,15vw,68px);height:auto;stroke:var(--brown);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .hint{display:flex;align-items:center;justify-content:center;gap:12px;width:76%;margin:44px auto 0;background:var(--cream);color:#000;
    border-radius:22px;padding:18px 10px;font-weight:700;font-size:clamp(11px,3.2vw,15px);letter-spacing:.06em}
  .hint svg{width:26px;height:26px;stroke:#000;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
